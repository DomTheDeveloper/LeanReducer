name: Check the fourth-power criterion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/grh/*.lean
      - .github/workflows/sampling.yml
permissions:
  contents: read
jobs:
  sampling:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 41bbac1c78e806eced8fd373f6cb55e77a045af5
          path: proof
      - name: Prepare the project and install its exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          for module in ReciprocalInterpolation FourthPowers WeightedFourthPowers PrimeErrorFourthPowers SharpInterpolation; do
            cp "examples/grh/$module.lean" proof/src/
          done
          cat >> proof/lakefile.toml <<'TOML'

          [[lean_lib]]
          name = "Sampling"
          roots = ["ReciprocalInterpolation", "FourthPowers", "WeightedFourthPowers", "PrimeErrorFourthPowers", "SharpInterpolation"]
          TOML
          curl --proto '=https' -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd proof
          "$HOME/.elan/bin/lean" --version
      - name: Build the source of the prime error and check the sampling theorems
        shell: bash
        working-directory: proof
        run: |
          set -euo pipefail
          lake exe cache get
          lake build Sampling
          cat > "$RUNNER_TEMP/SamplingAudit.lean" <<'LEAN'
          import PrimeErrorFourthPowers
          import SharpInterpolation
          #print axioms PrimeErrorFourthPowers.bounds_iff
          #print axioms SharpInterpolation.quadratic_gap
          LEAN
          lake env lean "$RUNNER_TEMP/SamplingAudit.lean" | tee "$RUNNER_TEMP/sampling-axioms.txt"
          PYTHONPATH="$GITHUB_WORKSPACE" python3 - <<'PY'
          import os
          from pathlib import Path
          from leanreducer.verify import check_axioms
          names = dict.fromkeys(["PrimeErrorFourthPowers.bounds_iff", "SharpInterpolation.quadratic_gap"])
          print(check_axioms((Path(os.environ["RUNNER_TEMP"])/"sampling-axioms.txt").read_text(),
                             names, ["propext", "Classical.choice", "Quot.sound"]))
          PY
          for module in ReciprocalInterpolation FourthPowers WeightedFourthPowers PrimeErrorFourthPowers SharpInterpolation; do
            lake env leanchecker "$module"
          done
