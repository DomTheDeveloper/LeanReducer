name: Check the compact GRH revision
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/grh/share-ext.patch
      - examples/grh/public-endpoints.patch
      - examples/grh/FactorialLevels.lean
      - examples/grh/check_ext.py
      - examples/grh/case.json
      - .github/workflows/grh.yml
permissions:
  contents: read
jobs:
  full-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LEAN_NUM_THREADS: 2
      BASE: a57c37471c835968b1932a0f8347978b89ba7ab6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the pinned source and verify the expanded text
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/proof"
          git -C "$RUNNER_TEMP/proof" fetch -q --depth=1 https://github.com/EllaZhangCA/grh-lean-astra.git "$BASE"
          git -C "$RUNNER_TEMP/proof" checkout -q --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/proof" apply "$GITHUB_WORKSPACE/examples/grh/share-ext.patch"
          python3 examples/grh/check_ext.py "$RUNNER_TEMP/proof"
          git -C "$RUNNER_TEMP/proof" apply "$GITHUB_WORKSPACE/examples/grh/public-endpoints.patch"
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/proof/grh-compact"
          "$HOME/.elan/bin/lean" --version
      - name: Build the closure and check the five public statements
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/proof/grh-compact"
          lake exe cache get
          lake build
          python3 - <<'PYTHON'
          from pathlib import Path
          import json, os
          root = Path(os.environ["GITHUB_WORKSPACE"])
          case = json.loads((root / "examples/grh/case.json").read_text())
          lines = ["import Main"]
          for name, statement in case["endpoints"].items():
              lines += [f"example : {statement} := @{name}", f"#print axioms {name}"]
          Path("LeanReducerEndpoints.lean").write_text("\n".join(lines) + "\n")
          PYTHON
          lake env lean LeanReducerEndpoints.lean | tee "$RUNNER_TEMP/axioms.txt"
          PYTHONPATH="$GITHUB_WORKSPACE" python3 - <<'PYTHON'
          from pathlib import Path
          import json, os
          from leanreducer.verify import check_axioms
          root = Path(os.environ["GITHUB_WORKSPACE"])
          case = json.loads((root / "examples/grh/case.json").read_text())
          output = (Path(os.environ["RUNNER_TEMP"]) / "axioms.txt").read_text()
          print(check_axioms(output, case["endpoints"], case["axioms"]))
          PYTHON
          git -C "$RUNNER_TEMP/proof" diff --name-only HEAD -- grh-compact/src |
            sed -e 's|^grh-compact/src/||' -e 's|\.lean$||' -e 's|/|.|g' |
            while IFS= read -r module; do lake env leanchecker "$module"; done
          lake env leanchecker Main
          lake env lean "$GITHUB_WORKSPACE/examples/grh/FactorialLevels.lean"
