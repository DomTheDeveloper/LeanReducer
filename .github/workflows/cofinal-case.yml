name: Audit the 976-line arithmetic contract with LeanReducer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/grh/cofinal-case.json
      - .github/workflows/cofinal-case.yml
permissions:
  contents: read
jobs:
  reducer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ae21d67f172b180b660d9bfa2183e3f806ab0ef2
          path: proof
      - name: Install Lean and audit the pinned checkout
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          python3 -m leanreducer reduce --repo proof --config examples/grh/cofinal-case.json \
            --output audit --cache --target 1000
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('audit/verification.json').read_text())
          c = r['after']
          assert r['target_met'] and c == r['tree_after']
          assert (c['modules'], c['code'], c['physical']) == (19, 976, 1338)
          assert set(r['axioms']['SampledGRH.five_endpoints']) == {'propext', 'Classical.choice', 'Quot.sound'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cofinal-reducer-verification
          path: audit/verification.json
