name: Verify the free-modulus conditional RH and GRH proof
on:
  push:
    branches: [auxiliary-multiples-grh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          sha256sum -c SOURCE.sha256
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "*.lean"], text=True).splitlines()
          physical = sum(len(Path(f).read_bytes().splitlines()) for f in files)
          print(f"{len(files)} Lean files contain {physical} physical lines")
          assert physical == 990 and physical <= 1000
          PYTHON
          curl --proto '=https' -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Build and replay the conditional proof
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          cat > "$RUNNER_TEMP/ConditionalAudit.lean" <<'LEAN'
          import SampledGRH
          open Filter Real
          open scoped Classical
          example (S : Set ℕ) : DivergentPrimes S ↔
              ¬ Summable (fun n : ℕ ↦ (if n.Prime ∧ n ∈ S then Real.log n else 0) / n) := Iff.rfl
          example (M : ℕ) [NeZero M] (δ : ℝ) : SampledGRH.EstimateAt M δ ↔
              ∃ S : Set ℕ, DivergentPrimes S ∧
              ∀ d : Nat.Primes, d.val ∈ S → (d.val % 8 = 7 ∧ M.Coprime d.val) ∧
              ∀ᶠ n : ℕ in atTop, primeError d.val M ((n:ℝ)^4) ≤ ((n:ℝ)^4)^(-(1/2:ℝ) + δ/4) := Iff.rfl
          example : (∀ (q : ℕ) [NeZero q] (ε : ℝ), 0 < ε → ∃ M : ℕ, ∃ pos : NeZero M,
              q ∣ M ∧ ∃ δ : ℝ, 0 < δ ∧ δ ≤ 1 ∧ δ ≤ ε ∧ @SampledGRH.EstimateAt M pos δ) →
              RiemannHypothesis ∧ RiemannZetaZerosOnLine ∧ DirichletLNonvanishingRightOfHalf ∧
              DirichletLZerosOnLine ∧ PrimitiveDirichletLZerosOnLine := SampledGRH.five_endpoints
          #print axioms SampledGRH.five_endpoints
          LEAN
          lake env lean "$RUNNER_TEMP/ConditionalAudit.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -Fx "'SampledGRH.five_endpoints' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          lake env lean verification/MassFromClass.lean
          while IFS= read -r f; do
            module="${f#src/}"
            module="${module%.lean}"
            lake env leanchecker "${module//\//.}"
          done < <(find src -name '*.lean' | sort)
