name: Audit the 950-line divergent-prime contract with LeanReducer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/grh/prime-weight-case.json
      - examples/grh/OldToDivergent.lean
      - .github/workflows/prime-weight-case.yml
permissions:
  contents: read
jobs:
  reducer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 39d23a7d38d6d53c3618646c8831cd91fd8295eb
          path: proof
      - name: Install Lean and audit the pinned checkout
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          python3 -m leanreducer reduce --repo proof --config examples/grh/prime-weight-case.json \
            --output audit --cache --target 1000
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('audit/verification.json').read_text())
          c = r['after']
          assert r['target_met'] and c == r['tree_after']
          assert (c['modules'], c['code'], c['physical']) == (18, 950, 975)
          assert set(r['axioms']['SampledGRH.five_endpoints']) == {'propext', 'Classical.choice', 'Quot.sound'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prime-weight-950-verification
          path: audit/verification.json
      - name: Check that the earlier residue-class condition implies the new prime-set condition
        working-directory: proof
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build
          lake env lean "$GITHUB_WORKSPACE/examples/grh/OldToDivergent.lean" | tee "$RUNNER_TEMP/bridge.txt"
          grep -Fx "'OldToDivergent.old_level_implies_divergent' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/bridge.txt"
