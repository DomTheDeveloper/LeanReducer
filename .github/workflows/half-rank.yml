name: Check the half-rank covolume comparison
on:
  push:
    branches: [ordinary-rh-half-rank]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DomTheDeveloper/LeanReducer
          ref: 817d82e311949408f8876d7b352df4d173776ec8
          path: verification-tools
      - name: Restore checked dependencies
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          export PATH="$(lean --print-prefix)/bin:$PATH"
          python3 verification-tools/examples/grh/fixed-class/restore.py
      - name: Check arithmetic positivity and the rank inequality
        run: |
          set -euo pipefail
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/HalfRank.olean src/HalfRank.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/RankFromCovolume.olean src/RankFromCovolume.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/CompletionHeight.olean src/CompletionHeight.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/FixedClass.olean src/FixedClass.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/RHWindow.olean src/RHWindow.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/HeightCriterion.olean src/HeightCriterion.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/HeightSupply.olean src/HeightSupply.lean
          lake env lean -R src -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxHeartbeats=4000000 -DmaxSynthPendingDepth=3 --tstack=400000 -o .lake/build/lib/lean/OneVolume.olean src/OneVolume.lean
          lake env leanchecker HalfRank RankFromCovolume CompletionHeight FixedClass RHWindow HeightCriterion HeightSupply OneVolume
          cat > "$RUNNER_TEMP/Audit.lean" <<'LEAN'
          import RankFromCovolume
          import CompletionHeight
          import HeightSupply
          import OneVolume
          #print axioms FixedClassRH.certificate_of_one_volume
          example : RiemannHypothesis := FixedClassRH.ordinaryRH_from_height_certificates
          #print axioms FixedClassRH.ordinaryRH_from_height_certificates
          #print axioms FixedClassRH.heightCertificate_of_covolume
          #print axioms FixedClassRH.ofHeightCertificates
          #print axioms FixedClassRH.lower_of_relaxed_rank
          #print axioms FixedClassRH.relaxed_rank_of_original
          #print axioms FixedClassRH.lower_with_completion
          #print axioms FixedClassRH.nominal_primeSum_le
          #print axioms FixedClassRH.nominal_gain_le_jet
          #print axioms FixedClassRH.thick_le_dirCost
          #print axioms FixedClassRH.dirCost_nonneg
          #print axioms FixedClassRH.half_rank_comparison
          #print axioms FixedClassRH.half_rank_with_completion
          #print axioms FixedClassRH.mainHeight_nonneg
          #print axioms FixedClassRH.star_of_half_rank
          #print axioms FixedClassRH.positive_rank_comparison
          #print axioms FixedClassRH.mainHeight_margin
          #print axioms FixedClassRH.star_of_positive_rank
          LEAN
          lake env lean "$RUNNER_TEMP/Audit.lean" | tee "$RUNNER_TEMP/axioms.log"
          PYTHONPATH=verification-tools python3 - <<'PY'
          import os
          from pathlib import Path
          from leanreducer.verify import check_axioms
          from leanreducer.source import Corpus
          corpus = Corpus(Path('src'), ['Mathlib', 'Lean', 'Std', 'Init'])
          print('Conditional height criterion', corpus.size(corpus.walk('HeightCriterion')))
          print('Single-volume local estimates', corpus.size(corpus.walk('OneVolume')))
          base = corpus.walk('HeightCriterion')
          for name in ['New.Heights.OneDeterminant', 'New.Filling.Moments', 'New.Exchange.CrudeRows', 'New.Rows.RowVolume', 'New.Endgame.ShortAndEnough', 'New.Selmer.FitTwistsExist']:
              size = corpus.size(base | corpus.walk(name))['code']
              print('Criterion with', name, size, 'headroom', 49_999 - size)
          print('With the full geometric supplier', corpus.size(corpus.walk('HeightSupply')))
          names = ['certificate_of_one_volume', 'ordinaryRH_from_height_certificates', 'heightCertificate_of_covolume', 'ofHeightCertificates', 'lower_of_relaxed_rank', 'relaxed_rank_of_original', 'lower_with_completion', 'nominal_primeSum_le', 'dirCost_nonneg', 'half_rank_comparison', 'half_rank_with_completion', 'mainHeight_nonneg', 'star_of_half_rank', 'nominal_gain_le_jet', 'thick_le_dirCost', 'positive_rank_comparison', 'mainHeight_margin', 'star_of_positive_rank']
          print(check_axioms(Path(os.environ['RUNNER_TEMP'], 'axioms.log').read_text(),
              {'FixedClassRH.' + n: '' for n in names}, ['propext', 'Classical.choice', 'Quot.sound']))
          PY
